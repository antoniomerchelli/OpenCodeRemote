<style type="text/tailwindcss">
        @layer utilities {
            .state-pulse-active {
                box-shadow: 0 0 15px rgba(57, 210, 192, 0.2);
            }
            .obsidian-glass {
                background: rgba(28, 27, 28, 0.4);
                backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
      background-color: #131314;
    }
  </style>

<body class="bg-[#131314] text-on-surface min-h-screen flex items-center justify-center p-md overflow-hidden antialiased">
<!-- Background atmospheric effect (minimal) -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-[#39D2C0] opacity-5 blur-[120px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[440px] z-10 relative">
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mb-xl">
<div class="w-16 h-16 rounded-[1.5rem] bg-surface-container-low border border-white/10 flex items-center justify-center shadow-lg mb-sm">
<!-- Geometric Cursor/Wave Logo -->
<svg fill="none" height="32" viewbox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg">
<path d="M6 16L12 22L26 8" stroke="#39D2C0" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<path d="M6 24H26" stroke="#414755" stroke-linecap="round" stroke-width="3"></path>
</svg>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Init Session</h1>
</div>
<!-- Connection Form Card -->
<div class="obsidian-glass rounded-[2rem] p-8 shadow-2xl relative">
<!-- Terminal Header Decoration -->
<div class="flex items-center gap-2 mb-lg border-b border-white/5 pb-sm">
<div class="w-3 h-3 rounded-full bg-white/20"></div>
<div class="w-3 h-3 rounded-full bg-white/20"></div>
<div class="w-3 h-3 rounded-full bg-white/20"></div>
<span class="ml-auto font-label-caps text-label-caps text-outline">SSH_AUTH_REQ</span>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); document.getElementById('connectBtn').classList.add('state-pulse-active');">
<!-- Host Field -->
<div class="flex flex-col gap-xs">
<label class="font-system-code text-system-code text-on-surface-variant flex items-center gap-xs" for="host">
<span class="text-[#39D2C0]">&gt;</span> indirizzo_host
                    </label>
<input class="w-full bg-surface-container-lowest border border-white/5 rounded-2xl px-4 py-3 font-system-code text-system-code text-on-surface placeholder:text-outline focus:outline-none focus:border-[#39D2C0] focus:ring-1 focus:ring-[#39D2C0] transition-all" id="host" placeholder="es. 192.168.1.100" type="text"/>
</div>
<!-- Port Field -->
<div class="flex flex-col gap-xs">
<label class="font-system-code text-system-code text-on-surface-variant flex items-center gap-xs" for="port">
<span class="text-[#39D2C0]">&gt;</span> porta
                    </label>
<input class="w-full bg-surface-container-lowest border border-white/5 rounded-2xl px-4 py-3 font-system-code text-system-code text-on-surface placeholder:text-outline focus:outline-none focus:border-[#39D2C0] focus:ring-1 focus:ring-[#39D2C0] transition-all" id="port" type="number" value="22"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-system-code text-system-code text-on-surface-variant flex items-center gap-xs" for="password">
<span class="text-[#39D2C0]">&gt;</span> password
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-white/5 rounded-2xl px-4 py-3 font-system-code text-system-code text-on-surface placeholder:text-outline focus:outline-none focus:border-[#39D2C0] focus:ring-1 focus:ring-[#39D2C0] transition-all pr-xl" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Status Line -->
<div class="mt-xs flex items-center gap-sm bg-surface-container-lowest/50 border border-white/5 rounded-2xl p-4">
<div class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#39D2C0] opacity-60"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-[#39D2C0] shadow-[0_0_12px_rgba(57,210,192,0.8)]"></span>
</div>
<span class="font-system-code text-system-code text-on-surface-variant">Stato: <span class="text-on-surface">Pronto per la connessione</span></span>
</div>
<!-- Primary Action -->
<button class="mt-4 w-full bg-[#39D2C0] hover:brightness-110 text-[#003731] font-headline-lg-mobile text-[18px] py-4 rounded-3xl transition-all duration-300 flex justify-center items-center gap-3 shadow-[0_4px_24px_rgba(57,210,192,0.2)]" id="connectBtn" type="submit">
<span class="font-bold">Connetti</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
</div>
<!-- Secondary Link -->
<div class="mt-lg text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-[#39D2C0] transition-colors inline-flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]">help</span>
                Come trovo questi dati?
            </a>
</div>
</main>
</body></html>
